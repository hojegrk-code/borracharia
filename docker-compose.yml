version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: borracharia-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-borracharia}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - borracharia_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-borracharia}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - borracharia-network

volumes:
  borracharia_postgres_data:
    name: borracharia_postgres_data
    driver: local

networks:
  borracharia-network:
    name: borracharia-network
    driver: bridge
