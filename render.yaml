services:
  - type: web
    name: borracharia-core-api
    runtime: node
    plan: starter
    region: ohio
    rootDir: .
    buildCommand: pnpm --filter @borracharia/core-api build
    startCommand: pnpm --filter @borracharia/core-api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ASAAS_API_KEY
        sync: false
